name: Ozon Price Monitor

on:
  # Запуск каждые 4 часа
  schedule:
    - cron: '0 */4 * * *'
  # Возможность запустить вручную из вкладки Actions
  workflow_dispatch:

# Нужно для загрузки артефактов (логов)
permissions:
  contents: read

jobs:
  check-price:
    runs-on: ubuntu-latest
    timeout-minutes: 15

    steps:
      - name: Checkout репозитория
        uses: actions/checkout@v4

      - name: Установка Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'
          cache: 'pip'

      - name: Установка зависимостей Python
        run: |
          python -m pip install --upgrade pip
          pip install playwright requests

      - name: Установка браузера Chromium для Playwright
        run: |
          playwright install chromium
          playwright install-deps chromium

      # Кэшируем профиль браузера между запусками,
      # чтобы сохранялись cookies и Ozon не выдавал капчу
      - name: Восстановление профиля браузера из кэша
        uses: actions/cache@v4
        with:
          path: ozon_profile
          key: ozon-profile-${{ github.run_id }}
          restore-keys: |
            ozon-profile-

      - name: Запуск мониторинга цены
        env:
          TELEGRAM_BOT_TOKEN: ${{ secrets.TELEGRAM_BOT_TOKEN }}
          TELEGRAM_CHAT_ID: ${{ secrets.TELEGRAM_CHAT_ID }}
        run: python ozon_monitor.py

      - name: Сохранение логов как артефакт
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: ozon-logs-${{ github.run_number }}
          path: logs/
          if-no-files-found: ignore
          retention-days: 7
