name: Ozon price monitor

on:
  schedule:
    - cron: "0 */4 * * *"
  workflow_dispatch:

permissions:
  contents: write

jobs:
  check-price:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Install dependencies
        run: |
          pip install playwright requests
          playwright install --with-deps chromium

      - name: Check Ozon price and notify Telegram
        env:
          TELEGRAM_BOT_TOKEN: ${{ secrets.TELEGRAM_BOT_TOKEN }}
          TELEGRAM_CHAT_ID: ${{ secrets.TELEGRAM_CHAT_ID }}
        run: python ozon_monitor.py

      - name: Save check log to repository
        run: |
          git config user.name "ozon-price-monitor"
          git config user.email "ozon-price-monitor@users.noreply.github.com"
          git add logs/ozon_checks.txt
          git diff --cached --quiet || git commit -m "Ozon price check"
          git push
