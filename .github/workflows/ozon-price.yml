name: Ozon Price Monitor

# ВНИМАНИЕ: запуск на GitHub-hosted runner НЕ РАБОТАЕТ.
#
# Ozon отдаёт с зарубежных и датацентровых IP страницу-заглушку
# "Похоже, нет соединения" (HTTP 403), поэтому цену получить нельзя.
# Это проверено экспериментально: см. README.md, раздел
# "Почему это не работает на GitHub Actions".
#
# Расписание намеренно отключено, чтобы не присылать ложные сообщения.
# Workflow заработает, если заменить runs-on на self-hosted runner
# с российским домашним IP.

on:
  # schedule:
  #   - cron: '0 */4 * * *'
  workflow_dispatch:

permissions:
  contents: read

jobs:
  check-price:
    runs-on: ubuntu-latest
    timeout-minutes: 15

    steps:
      - name: Checkout репозитория
        uses: actions/checkout@v4

      - name: Установка Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'

      - name: Установка зависимостей Python
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt

      - name: Установка браузера Chromium для Playwright
        run: |
          python -m playwright install chromium
          python -m playwright install-deps chromium

      - name: Запуск мониторинга цены
        env:
          TELEGRAM_BOT_TOKEN: ${{ secrets.TELEGRAM_BOT_TOKEN }}
          TELEGRAM_CHAT_ID: ${{ secrets.TELEGRAM_CHAT_ID }}
        run: python ozon_monitor.py

      - name: Сохранение логов как артефакт
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: ozon-logs-${{ github.run_number }}
          path: logs/
          if-no-files-found: ignore
          retention-days: 7
